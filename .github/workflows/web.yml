name: Aktualizovať a zverejniť web

on:
  schedule:
    - cron: '0 11 * * 1-5'   # pracovné dni 12:00 SEČ (pred otvorením burzy v USA)
    - cron: '30 21 * * 1-5'  # pracovné dni 22:30 SEČ (po zatvorení burzy)
  workflow_dispatch:          # ručné spustenie tlačidlom „Run workflow“
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stiahnuť dáta
        run: node fetch.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
